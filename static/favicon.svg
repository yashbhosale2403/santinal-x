<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="50%" stop-color="#319795"/>
      <stop offset="100%" stop-color="#2C7A7B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#319795" stroke-width="8"/>
  
  <!-- Outer Shield Glow / Border -->
  <path d="M 256,76 L 380,132 C 380,268 332,364 256,436 C 180,364 132,268 132,132 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Dark Shield -->
  <path d="M 256,104 L 356,150 C 356,260 316,340 256,400 C 196,340 156,260 156,150 Z" 
        fill="#0F172A"/>

  <!-- Stylized Sentinel 'X' inside Shield -->
  <path d="M 200,180 L 235,180 L 256,225 L 277,180 L 312,180 L 277,245 L 316,315 L 281,315 L 256,265 L 231,315 L 196,315 L 235,245 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Shield Core Lock / Core Dot -->
  <circle cx="256" cy="245" r="16" fill="#4FD1C5"/>
  <circle cx="256" cy="245" r="8" fill="#0F172A"/>
</svg>